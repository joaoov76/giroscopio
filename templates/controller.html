<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Controle Gyro Flappy</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="controller">
  <h1>Controle</h1>
  <p id="status">Conectando...</p>

  <div class="name-box">
    <label for="playerName">Seu nome (aparece no jogo e no ranking)</label>
    <input id="playerName" type="text" maxlength="20" placeholder="Jogador">
  </div>

  <div class="game-select">
    <label>Escolha o jogo</label>
    <div class="game-buttons">
      <button type="button" class="game-btn" data-game="flappy">🐦 Flappy</button>
      <button type="button" class="game-btn" data-game="breakout">🧱 Breakout</button>
      <button type="button" class="game-btn" data-game="dots">🔵 Ligue os Pontos</button>
      <button type="button" class="game-btn" data-game="birds">🎯 Gyro Birds</button>
    </div>
    <p id="selectedGame" class="hint"></p>
  </div>

  <button id="enable">Ativar giroscópio</button>
  <button id="action" class="action-btn">Soltar 🐦</button>
  <p class="hint">O botão "Soltar" é usado no jogo Gyro Birds para lançar o pássaro.</p>
  <div class="sensor">
    <div>Alpha: <b id="alpha">0</b></div>
    <div>Beta: <b id="beta">0</b></div>
    <div>Gamma: <b id="gamma">0</b></div>
  </div>
  <p>Incline o celular para controlar o personagem.</p>
  <p id="diagnostic" class="diagnostic"></p>
</main>
<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<script src="/static/player.js"></script>
<script src="/static/controller.js"></script>
</body>
</html>
